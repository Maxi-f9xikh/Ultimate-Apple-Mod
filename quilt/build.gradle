plugins {
    id 'com.github.johnrengelman.shadow'
}

// Quilt Loader re-bundles all net.fabricmc.* classes as compatibility shims.
// Having fabric-loader alongside quilt-loader causes SecurityException (checkCerts)
// because both JARs contain classes in net.fabricmc.loader.impl.launch.knot.*
// but with different signing certificates.
configurations.all {
    exclude group: 'net.fabricmc', module: 'fabric-loader'
    // quilted-fabric-api provides all Fabric API modules under the same mod IDs.
    // Having the original fabric-api alongside it causes Quilt Loader to abort
    // with "Duplicate mandatory mod ids" for every Fabric API module.
    exclude group: 'net.fabricmc.fabric-api'
}

architectury {
    platformSetupLoomIde()
    fabric()  // Quilt runs Fabric API through quilted-fabric-api; use fabric() target
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentQuilt.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "org.quiltmc:quilt-loader:$rootProject.quilt_loader_version"
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:$rootProject.quilted_fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Common module (source of truth for all game logic)
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Fabric module: needed at compile time so QuiltModInit can call FabricModInit,
    // and included in the shadow jar so the delegation actually runs at runtime.
    modCompileOnly(project(path: ':fabric', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':fabric', configuration: 'namedElements')

    // NOTE: fabric-classes-only JAR must be loaded by Knot's ClassLoader, not the
    // parent/system ClassLoader. If it lands on the JVM classpath (via runtimeOnly),
    // the parent CL loads it in a context where Bootstrap.bootstrapped is never set
    // true, so the first BuiltInRegistries access throws ExceptionInInitializerError.
    // Solution: append the JAR to remapClasspath.txt (see appendFabricJarToRemapClasspath
    // task below) so Knot loads it through its own CL where Bootstrap ran correctly.
}

processResources {
    inputs.property 'version', project.version

    filesMatching('quilt.mod.json') {
        expand version: project.version
    }

    // Quilt Loader resolves mixin config files relative to the mod root directory
    // (quilt/build/resources/main/) rather than searching the full classpath like
    // Fabric Loader does. In the dev environment, common/fabric resources sit in
    // separate output directories, so Quilt Loader cannot find them unless we
    // copy the mixin JSONs into the quilt build output explicitly.
    from(project(':common').sourceSets.main.resources) {
        include '*.mixins.json'
    }
    from(project(':fabric').sourceSets.main.resources) {
        include '*.mixins.json'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// Quilt 0.26+ uses its own launcher class, not the net.fabricmc.* shim.
// Override the DLI main class so IntelliJ launches via Quilt's KnotClient.
loom {
    runs {
        client {
            vmArgs "-Dfabric.dli.main=org.quiltmc.loader.impl.launch.knot.KnotClient"
        }
        server {
            vmArgs "-Dfabric.dli.main=org.quiltmc.loader.impl.launch.knot.KnotServer"
        }
    }
}

// Append the fabric classes-only JAR to remapClasspath.txt so that Knot's own
// ClassLoader (not the parent/system CL) loads the fabric implementation classes.
//
// Why this is necessary:
//   - runtimeOnly → JVM classpath → parent CL.  Parent CL never runs Bootstrap,
//     so Bootstrap.bootstrapped stays false.  First access to BuiltInRegistries
//     in that CL context throws ExceptionInInitializerError: Not bootstrapped.
//   - remapClasspath.txt → Knot CL.  Bootstrap ran there; registries work fine.
//
// Why we can't use developmentQuilt(project(':fabric', 'classesOnly')):
//   Loom's configureLaunch iterates resolvedConfiguration.resolvedArtifacts.
//   Custom configurations and files() deps are silently ignored — the JAR never
//   appears in architectury.classpath or remapClasspath.txt automatically.
//
// The fabric-classes-only JAR carries Fabric-Mapping-Namespace: named in its
// MANIFEST.MF, so Loom/Knot skips intermediary→named remapping for it.
// It contains no fabric.mod.json, so Quilt Loader won't detect a duplicate mod.
def appendFabricJarToRemapClasspath = tasks.register('appendFabricJarToRemapClasspath') {
    dependsOn ':fabric:fabricClassesOnlyJar'
    doLast {
        def remapCpFile = file("${projectDir}/.gradle/loom-cache/remapClasspath.txt")
        if (!remapCpFile.exists()) {
            logger.warn('appendFabricJarToRemapClasspath: remapClasspath.txt not found — skipping')
            return
        }
        def fabricJarPath = project(':fabric').tasks.named('fabricClassesOnlyJar').get()
                .archiveFile.get().asFile.absolutePath
        def content = remapCpFile.text
        if (!content.contains(fabricJarPath)) {
            remapCpFile.text = content.endsWith(';') ? content + fabricJarPath
                                                     : content + ';' + fabricJarPath
            logger.lifecycle("appendFabricJarToRemapClasspath: added ${fabricJarPath}")
        } else {
            logger.lifecycle("appendFabricJarToRemapClasspath: already present, skipped")
        }
    }
}

// Wire the append after every task that (re-)writes remapClasspath.txt.
// configureLaunch / configureClientLaunch are the Loom tasks that produce the file.
afterEvaluate {
    ['configureLaunch', 'configureClientLaunch'].each { taskName ->
        def t = tasks.findByName(taskName)
        if (t != null) {
            t.finalizedBy appendFabricJarToRemapClasspath
        }
    }
}
