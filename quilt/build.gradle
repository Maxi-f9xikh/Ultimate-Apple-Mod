plugins {
    id 'com.github.johnrengelman.shadow'
}

// Quilt Loader re-bundles all net.fabricmc.* classes as compatibility shims.
// Having fabric-loader alongside quilt-loader causes SecurityException (checkCerts)
// because both JARs contain classes in net.fabricmc.loader.impl.launch.knot.*
// but with different signing certificates.
configurations.all {
    exclude group: 'net.fabricmc', module: 'fabric-loader'
    // quilted-fabric-api provides all Fabric API modules under the same mod IDs.
    // Having the original fabric-api alongside it causes Quilt Loader to abort
    // with "Duplicate mandatory mod ids" for every Fabric API module.
    exclude group: 'net.fabricmc.fabric-api'
}

architectury {
    platformSetupLoomIde()
    fabric()  // Quilt runs Fabric API through quilted-fabric-api; use fabric() target
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentQuilt.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "org.quiltmc:quilt-loader:$rootProject.quilt_loader_version"
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:$rootProject.quilted_fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Common module (source of truth for all game logic)
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Fabric module: needed at compile time so QuiltModInit can call FabricModInit,
    // and included in the shadow jar so the delegation actually runs at runtime.
    modCompileOnly(project(path: ':fabric', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':fabric', configuration: 'namedElements')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('quilt.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// Quilt 0.26+ uses its own launcher class, not the net.fabricmc.* shim.
// Override the DLI main class so IntelliJ launches via Quilt's KnotClient.
loom {
    runs {
        client {
            vmArgs "-Dfabric.dli.main=org.quiltmc.loader.impl.launch.knot.KnotClient"
        }
        server {
            vmArgs "-Dfabric.dli.main=org.quiltmc.loader.impl.launch.knot.KnotServer"
        }
    }
}
