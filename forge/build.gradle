plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "ultimate_apple_mod.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    // NOTE: developmentForge must NOT extend common here.
    // Adding the common dev-JAR to developmentForge causes Architectury to list it in
    // architectury.classpath, so Forge's module scanner sees both the original dev-JAR
    // (module "ultimate.apple.mod.common") AND the transformer-generated fake-mod JAR
    // (module "generated_XXXXXXX") at the same time — split-package ResolutionException.
    // The Architectury transformer already adds the transformed JAR to Forge's runtime,
    // so developmentForge does not need the raw dev-JAR.

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    // Common-Projekt einbinden.
    // Only use the custom 'common' configuration — compileClasspath/runtimeClasspath/developmentForge
    // already extend it (see above).  Adding implementation project(":common") on top would put the
    // named JAR on Forge's module path TWICE (once as common-dev, once as common), causing a JPMS
    // split-package ResolutionException at startup.
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'namedElements')

    // JEI (Just Enough Items) — compile-only: mod works without it, integrates when present
    compileOnly "mezz.jei:jei-1.20.4-common-api:17.3.0.52"
    compileOnly "mezz.jei:jei-1.20.4-forge-api:17.3.0.52"
    // Uncomment to test JEI features in the dev environment:
    // runtimeOnly "mezz.jei:jei-1.20.4-forge:17.3.0.52"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}




jar {
    from("src/main/resources/META-INF/logo.png") {
        into "META-INF"
    }
}

// Suppress @Deprecated(forRemoval=true) warnings from Forge 49 APIs that have
// not been updated yet — these are warnings not errors and the build succeeds,
// but IntelliJ counts [removal] warnings as "errors" in its Build panel.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-removal'
}

// ── Fix Forge JPMS split-package crash ────────────────────────────────────────
// Architectury Loom adds the common dev-JAR to architectury.classpath in
// forge/.gradle/architectury/.properties.  At "Scanning mod candidates", Forge's
// securemodules sees BOTH the raw dev-JAR (module "ultimate.apple.mod.common") AND
// the Architectury-transformed fake-mod JAR (module "generated_XXXXXXX"), which
// export the same packages → ResolutionException.
//
// Fix: remove the dev-JAR entry from architectury.classpath after ideaSyncTask
// generates the file.  The Architectury transformer still uses .transforms to
// inject the common module at runtime via the generated JAR.
tasks.register("patchArchitecturyClasspath") {
    group = "architectury"
    description = "Remove common dev-JAR from architectury.classpath to prevent Forge split-package crash"

    doLast {
        def propFile = file(".gradle/architectury/.properties")
        if (!propFile.exists()) {
            logger.warn("patchArchitecturyClasspath: .properties not found, skipping")
            return
        }

        def content = propFile.text
        // Match the dev-JAR entry (Windows escaped backslashes in a .properties value)
        def patched = content.replaceAll(
            /E\\:.*?ultimate_apple_mod-common-[^;\\n]+-dev\.jar;?/,
            ''
        )

        if (patched != content) {
            propFile.text = patched
            logger.lifecycle("patchArchitecturyClasspath: removed common dev-JAR from architectury.classpath")
        } else {
            logger.warn("patchArchitecturyClasspath: dev-JAR pattern not found in architectury.classpath (may already be clean)")
        }
    }
}

// Auto-run after every ideaSyncTask so the fix survives Gradle reloads
tasks.matching { it.name == "ideaSyncTask" }.configureEach {
    finalizedBy("patchArchitecturyClasspath")
}
