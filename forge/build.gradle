plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    neoForge {
        mixinConfig "ultimate_apple_mod.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Common-Projekt einbinden
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'namedElements')
    implementation project(":common")

    // JEI (Just Enough Items) — compile-only
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    // Uncomment to test JEI features in the dev environment:
    // runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.21.0.247"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

jar {
    from("src/main/resources/META-INF/logo.png") {
        into "META-INF"
    }
}
