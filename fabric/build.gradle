plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Outbound: compiled classes only (no fabric.mod.json) for the Quilt dev classpath.
    // Consumed by :quilt as runtimeOnly so it lands on runtimeClasspath → IntelliJ
    // module classpath → Knot's JVM classpath at dev-run time.
    classesOnly {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Produce the classes-only JAR that :quilt's Quilt dev run needs.
// No resources → no fabric.mod.json → Quilt Loader won't see a duplicate mod.
// Fabric-Mapping-Namespace: named → Knot/Loom skips intermediary remapping.
def fabricClassesOnlyJar = tasks.register('fabricClassesOnlyJar', Jar) {
    group = 'build'
    description = 'Fabric compiled classes (no resources) for the Quilt dev classpath'
    archiveBaseName = 'fabric-classes-only'
    archiveVersion = ''
    archiveClassifier = 'dev-classes'
    manifest {
        attributes('Fabric-Mapping-Namespace': 'named')
    }
    from(sourceSets.main.output.classesDirs)
    dependsOn compileJava
}

artifacts {
    classesOnly(fabricClassesOnlyJar)
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
